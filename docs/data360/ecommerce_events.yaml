openapi: 3.0.3
# ===========================================================================
# Esquema para a Salesforce Data 360 (Data Cloud) Ingestion API — EVENTOS de
# comportamento do e-commerce (streaming). Complementa ecommerce_contract.yaml
# (entidades PF/PJ/pedidos).
#
# IMPORTANTE: o validador da Ingestion API é restrito — aceita apenas
# `openapi` + `components/schemas`. NÃO inclua `info`, `paths` nem `description`
# nos campos (causa "File contains invalid schema").
#
# Restrições respeitadas:
#   - Tipos permitidos: string, number, boolean (datas = string + format date-time).
#     NÃO use `integer` (contadores/quantidades vão como number).
#   - SEM objetos aninhados e SEM arrays -> o envelope do site é ACHATADO antes
#     do POST (ver docs/INGESTAO-DATA360.md, seção "Shaping").
#   - Chave única por objeto (event_id / line_id) para deduplicação.
#   - occurred_at é o event time field (categoria Engagement exige datetime).
# ===========================================================================
components:
  schemas:

    ecommerce_events:
      type: object
      required:
        - event_id
        - event_type
        - occurred_at
      properties:
        event_id:
          type: string
        event_type:
          type: string
        occurred_at:
          type: string
          format: date-time
        email:
          type: string
        phone:
          type: string
        document:
          type: string
        device_id:
          type: string
        reason:
          type: string
        product_id:
          type: string
        sku:
          type: string
        product_name:
          type: string
        category:
          type: string
        price:
          type: number
        action:
          type: string
        order_number:
          type: string
        status:
          type: string
        item_count:
          type: number
        subtotal:
          type: number
        total:
          type: number
        items_json:
          type: string

    ecommerce_order_items:
      type: object
      required:
        - line_id
        - order_number
        - occurred_at
        - product_id
      properties:
        line_id:
          type: string
        order_number:
          type: string
        occurred_at:
          type: string
          format: date-time
        product_id:
          type: string
        qty:
          type: number
        unit_price:
          type: number
        warranty:
          type: boolean
        email:
          type: string
        device_id:
          type: string
