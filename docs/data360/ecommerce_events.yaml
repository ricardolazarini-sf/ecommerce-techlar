openapi: 3.0.3
# ===========================================================================
# Esquema para a Salesforce Data 360 (Data Cloud) Ingestion API — EVENTOS de
# comportamento do e-commerce (streaming). Complementa ecommerce_contract.yaml
# (entidades PF/PJ/pedidos).
#
# IMPORTANTE: o validador da Ingestion API é restrito — aceita apenas
# `openapi` + `components/schemas`. NÃO inclua `info`, `paths` nem `description`
# nos campos (causa "File contains invalid schema").
#
# Restrições respeitadas:
#   - Tipos permitidos: string, number, boolean (datas = string + format date-time).
#     NÃO use `integer` (contadores/quantidades vão como number).
#   - SEM objetos aninhados e SEM arrays -> o envelope do site é ACHATADO antes
#     do POST (ver docs/INGESTAO-DATA360.md, seção "Shaping").
#   - Chave única por objeto (event_id / line_id) para deduplicação.
#   - occurred_at é o event time field (categoria Engagement exige datetime).
#
# TODO REGISTRO PRECISA DE TODAS AS CHAVES DECLARADAS AQUI.
#   O Data Stream recusa com 400 `required key [x] not found` qualquer registro
#   que omita uma propriedade declarada — inclusive as que estão FORA de
#   `required`. `required` só diz o que não pode vir vazio; a lista de chaves é
#   o formato da linha. Aprendido na ingestão de clientes (o `phone` opcional
#   quebrou o POST quando a chave foi omitida em vez de ir como "").
#   Por isso o achatador do events-server emite SEMPRE o conjunto completo:
#   string vazia nos campos de texto e 0 nos numéricos que não se aplicam ao
#   evento. Quem descarta o que está em branco é a transformação na Data 360,
#   não o cliente.
# ===========================================================================
components:
  schemas:

    ecommerce_events:
      type: object
      required:
        - event_id
        - event_type
        - occurred_at
      properties:
        event_id:
          type: string
        event_type:
          type: string
        occurred_at:
          type: string
          format: date-time
        email:
          type: string
        # Chave do Individual na org (`WEB-PF-<id>`/`WEB-PJ-<id>`), a mesma que
        # o contrato de clientes usa. É o que liga o clique ao perfil sem
        # depender de resolver e-mail -> cliente do lado da Data Cloud. Vazia
        # quando o visitante não está identificado.
        customer_id:
          type: string
        phone:
          type: string
        document:
          type: string
        device_id:
          type: string
        reason:
          type: string
        product_id:
          type: string
        sku:
          type: string
        product_name:
          type: string
        category:
          type: string
        price:
          type: number
        action:
          type: string
        order_number:
          type: string
        status:
          type: string
        item_count:
          type: number
        subtotal:
          type: number
        total:
          type: number
        items_json:
          type: string
        # Cliques do navegador: o termo buscado, de onde partiu o clique
        # (home, catalogo, busca, pdp, wishlist, barra-fixa), a rota, a
        # quantidade, e a atribuição do combo (slug e desconto em reais).
        search_term:
          type: string
        surface:
          type: string
        page_path:
          type: string
        qty:
          type: number
        combo_id:
          type: string
        discount:
          type: number

    ecommerce_order_items:
      type: object
      required:
        - line_id
        - order_number
        - occurred_at
        - product_id
      properties:
        line_id:
          type: string
        order_number:
          type: string
        occurred_at:
          type: string
          format: date-time
        product_id:
          type: string
        qty:
          type: number
        unit_price:
          type: number
        # Sem `warranty` por linha: a garantia estendida é do pedido (3% do que
        # pode ser garantido) e viaja dentro de total_amount em ecommerce_orders.
        email:
          type: string
        device_id:
          type: string
