openapi: 3.0.3
# ===========================================================================
# Schemas de ENTIDADE do e-commerce para a Data 360 Ingestion API, conformes ao
# Contrato de Dados da Sprint IV (Andreza).
#
# IMPORTANTE: o validador da Ingestion API é restrito — aceita apenas
# `openapi` + `components/schemas`. NÃO inclua `info`, `paths` nem `description`
# nos campos (causa "File contains invalid schema").
#
# Regras respeitadas:
#   - Tipos permitidos: string, number, boolean (datas = string + format date-time).
#   - IDs/CPF/CNPJ/telefone SEMPRE string (Text) — nunca number.
#   - Telefone em E.164 (+55DDDNUMERO). Datas em ISO 8601 UTC (yyyy-MM-ddTHH:mm:ss.SSSZ).
#   - Primary Key (definida na criação do Data Stream): customer_id / sales_order_id.
#   - Streams SEPARADOS por tipo de cliente (o contrato proíbe misturar PF e PJ).
# ===========================================================================
components:
  schemas:

    ecommerce_customers_pf:
      type: object
      required:
        - customer_id
        - first_name
        - last_name
        - cpf
        - id_type
        - id_name
        - email
        - updated_at
      properties:
        customer_id:
          type: string
        first_name:
          type: string
        last_name:
          type: string
        cpf:
          type: string
        id_type:
          type: string
        id_name:
          type: string
        email:
          type: string
        phone:
          type: string
        address_line1:
          type: string
        city:
          type: string
        country:
          type: string
        updated_at:
          type: string
          format: date-time

    ecommerce_customers_pj:
      type: object
      required:
        - customer_id
        - account_name
        - cnpj
        - email
        - updated_at
      properties:
        customer_id:
          type: string
        account_name:
          type: string
        cnpj:
          type: string
        email:
          type: string
        phone:
          type: string
        address_line1:
          type: string
        city:
          type: string
        country:
          type: string
        updated_at:
          type: string
          format: date-time

    ecommerce_orders:
      type: object
      required:
        - sales_order_id
        - customer_id
        - total_amount
        - order_date
      properties:
        sales_order_id:
          type: string
        customer_id:
          type: string
        total_amount:
          type: number
        order_date:
          type: string
          format: date-time
